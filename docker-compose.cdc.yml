services:
  # Optional override: logical replication is enabled only when this CDC file
  # is included. The core application does not depend on Debezium or Kafka.
  db:
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
      - -c
      - max_slot_wal_keep_size=2GB

  kafka:
    image: apache/kafka:4.2.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  connect:
    image: quay.io/debezium/connect:3.4
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: ph-expense-connect
      CONFIG_STORAGE_TOPIC: ph-expense-connect-configs
      OFFSET_STORAGE_TOPIC: ph-expense-connect-offsets
      STATUS_STORAGE_TOPIC: ph-expense-connect-statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    depends_on:
      kafka:
        condition: service_healthy

  cdc-init:
    image: curlimages/curl:8.15.0
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ph_expenses}
      POSTGRES_USER: ${POSTGRES_USER:-ph_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ph_password}
    volumes:
      - ./cdc/register-connector.sh:/register-connector.sh:ro
    entrypoint: ["sh", "/register-connector.sh"]
    depends_on:
      connect:
        condition: service_started
      backend:
        condition: service_started
    restart: "no"

volumes:
  kafka_data:
