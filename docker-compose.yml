services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must point to the Neon PostgreSQL database}
      TREASURER_EMAIL: ${TREASURER_EMAIL:-tesorero@example.com}
      PRESIDENT_EMAIL: ${PRESIDENT_EMAIL:-presidente@example.com}
      EMAIL_MODE: ${EMAIL_MODE:-console}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURITY: ${SMTP_SECURITY:-ssl}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      SECRET_KEY: ${SECRET_KEY:-development-only-change-me}
      TOKEN_EXPIRE_MINUTES: ${TOKEN_EXPIRE_MINUTES:-480}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      UPLOAD_DIR: /app/uploads
    volumes:
      - expense_uploads:/app/uploads
    expose:
      - "8000"

  frontend:
    build: ./frontend
    ports:
      # Local-only by default. Public MVP access is provided by the optional
      # Cloudflare tunnel, never by exposing this port on every interface.
      - "127.0.0.1:3000:80"
    depends_on:
      - backend

volumes:
  expense_uploads:
