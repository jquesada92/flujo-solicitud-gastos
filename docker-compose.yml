services:
  backend:
    build: ./backend
    # DEV application variables live in backend/.env. DATABASE_URL must point
    # to the Neon DEV database and DATABASE_SCHEMA to the application schema.
    env_file:
      - path: ${BACKEND_ENV_FILE:-./backend/.env}
        required: false
    environment:
      UPLOAD_DIR: /app/uploads
      # Docker Compose serves the SPA through Nginx on host port 3000. These
      # values intentionally override only the public frontend addresses; the
      # database connection remains the one declared in backend/.env.
      PUBLIC_URL: ${LOCAL_PUBLIC_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${LOCAL_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    volumes:
      - expense_uploads:/app/uploads
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_TIME_ZONE: ${VITE_TIME_ZONE:-America/Panama}
    ports:
      # Local-only by default. Public MVP access is provided by the optional
      # Cloudflare tunnel, never by exposing this port on every interface.
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  expense_uploads:
