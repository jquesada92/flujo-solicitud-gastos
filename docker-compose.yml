services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ph_expenses}
      POSTGRES_USER: ${POSTGRES_USER:-ph_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ph_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ph_user} -d ${POSTGRES_DB:-ph_expenses}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    # Backend application variables live in backend/.env. The file is optional
    # so a fresh checkout can still use safe development defaults.
    env_file:
      - path: ${BACKEND_ENV_FILE:-./backend/.env}
        required: false
    environment:
      # Development is intentionally isolated from Neon.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ph_user}:${POSTGRES_PASSWORD:-ph_password}@db:5432/${POSTGRES_DB:-ph_expenses}
      UPLOAD_DIR: /app/uploads
      # Docker Compose serves the SPA through Nginx on host port 3000. These
      # values intentionally override backend/.env so links embedded in local
      # approval/voting emails always point to the reachable Docker frontend.
      PUBLIC_URL: ${LOCAL_PUBLIC_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${LOCAL_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    volumes:
      - expense_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_TIME_ZONE: ${VITE_TIME_ZONE:-America/Panama}
    ports:
      # Local-only by default. Public MVP access is provided by the optional
      # Cloudflare tunnel, never by exposing this port on every interface.
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  expense_uploads:
