services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ph_expenses}
      POSTGRES_USER: ${POSTGRES_USER:-ph_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ph_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ph_user} -d ${POSTGRES_DB:-ph_expenses}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      # Development is intentionally isolated from Neon.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ph_user}:${POSTGRES_PASSWORD:-ph_password}@db:5432/${POSTGRES_DB:-ph_expenses}
      EMAIL_MODE: ${EMAIL_MODE:-console}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURITY: ${SMTP_SECURITY:-ssl}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-PH - Gestion de Gastos}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-America/Panama}
      SECRET_KEY: ${SECRET_KEY:-development-only-change-me}
      TOKEN_EXPIRE_MINUTES: ${TOKEN_EXPIRE_MINUTES:-480}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-30}
      USER_READ_RATE_LIMIT: ${USER_READ_RATE_LIMIT:-120}
      USER_WRITE_RATE_LIMIT: ${USER_WRITE_RATE_LIMIT:-30}
      USER_UPLOAD_RATE_LIMIT: ${USER_UPLOAD_RATE_LIMIT:-6}
      USER_SENSITIVE_RATE_LIMIT: ${USER_SENSITIVE_RATE_LIMIT:-10}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador del sistema}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      UPLOAD_DIR: /app/uploads
    volumes:
      - expense_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_TIME_ZONE: ${VITE_TIME_ZONE:-America/Panama}
    ports:
      # Local-only by default. Public MVP access is provided by the optional
      # Cloudflare tunnel, never by exposing this port on every interface.
      - "127.0.0.1:3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  expense_uploads:
