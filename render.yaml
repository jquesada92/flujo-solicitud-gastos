services:
  - type: web
    name: flujo-de-gastos-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    autoDeploy: false
    healthCheckPath: /api/health
    envVars:
      # Production authorization policy is activated explicitly by this value.
      # Preview/test services must use a non-production ENVIRONMENT value if the
      # technical system account needs full end-to-end testing permissions.
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ANALYTICS_HASH_KEY
        generateValue: true
      - key: PUBLIC_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_NAME
        value: Administrador del sistema
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: SESSION_IDLE_MINUTES
        value: "30"
      - key: USER_READ_RATE_LIMIT
        value: "120"
      - key: USER_WRITE_RATE_LIMIT
        value: "30"
      - key: USER_UPLOAD_RATE_LIMIT
        value: "6"
      - key: USER_SENSITIVE_RATE_LIMIT
        value: "10"
      - key: DEFAULT_PAGE_SIZE
        value: "25"
      - key: MAX_PAGE_SIZE
        value: "100"
      - key: SEARCH_MIN_CHARS
        value: "2"
      - key: QUERY_TIMEOUT_MS
        value: "5000"
      - key: APP_TIME_ZONE
        value: "America/Panama"
      - key: EMAIL_MODE
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_NAME
        value: Gestión de Solicitudes
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: MAX_UPLOAD_STORAGE_MB
        value: "450"
    disk:
      name: expense-uploads
      mountPath: /app/uploads
      sizeGB: 1
