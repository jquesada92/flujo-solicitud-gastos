services:
  - type: web
    name: flujo-de-gastos-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    autoDeploy: false
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: PUBLIC_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_NAME
        value: Administrador
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: EMAIL_MODE
        value: console
      - key: UPLOAD_DIR
        value: /app/uploads
    disk:
      name: expense-uploads
      mountPath: /app/uploads
      sizeGB: 1
