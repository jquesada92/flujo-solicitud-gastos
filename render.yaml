services:
  - type: web
    name: flujo-de-gastos-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    autoDeploy: false
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ANALYTICS_HASH_KEY
        generateValue: true
      - key: PUBLIC_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_NAME
        value: Administrador del sistema
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: SESSION_IDLE_MINUTES
        value: "30"
      - key: USER_READ_RATE_LIMIT
        value: "120"
      - key: USER_WRITE_RATE_LIMIT
        value: "30"
      - key: USER_UPLOAD_RATE_LIMIT
        value: "6"
      - key: USER_SENSITIVE_RATE_LIMIT
        value: "10"
      - key: APPROVAL_LINK_HOURS
        value: "72"
      - key: EMAIL_MODE
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURITY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_NAME
        value: PH · Gestión de Gastos
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: MAX_UPLOAD_STORAGE_MB
        value: "450"
    disk:
      name: expense-uploads
      mountPath: /app/uploads
      sizeGB: 1
